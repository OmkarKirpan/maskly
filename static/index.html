<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maskly — Redact Before Send</title>
<style>
  :root { --bg:#f6f5f2; --fg:#1b1b1b; --muted:#666; --card:#fff; --line:#ddd;
          --rules:#d62828; --gemma:#7b2cbf; --manual:#1d70b8; --warn:#fff3cd; --warnfg:#664d03; }
  @media (prefers-color-scheme: dark) { :root { --bg:#171717; --fg:#eee; --muted:#aaa; --card:#222; --line:#333;
          --warn:#3a2f05; --warnfg:#ffe08a; } }
  * { box-sizing:border-box }
  body { margin:0; font:15px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg) }
  header { display:flex; gap:12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap }
  h1 { font-size:20px; margin:0 auto 0 0 }
  button, label.btn { font:inherit; padding:7px 14px; border-radius:8px; border:1px solid var(--line);
          background:var(--card); color:var(--fg); cursor:pointer }
  button.primary { background:var(--fg); color:var(--bg); border-color:var(--fg) }
  button:disabled { opacity:.4; cursor:not-allowed }
  main { padding:16px }
  #drop { border:2px dashed var(--line); border-radius:12px; padding:64px 16px; text-align:center; color:var(--muted) }
  #drop.over { border-color:var(--manual) }
  #banner { display:none; background:var(--warn); color:var(--warnfg); padding:10px 14px; border-radius:8px; margin-bottom:12px }
  #wrap { position:relative; display:none }
  canvas { max-width:100%; height:auto; display:block; border-radius:6px; cursor:crosshair; box-shadow:0 1px 4px #0003 }
  #tip { position:fixed; pointer-events:none; background:#000d; color:#fff; padding:4px 8px; border-radius:6px; font-size:12px; display:none }
  #status { color:var(--muted); font-size:12px; margin:8px 0 }
  .legend span { display:inline-block; width:10px; height:10px; border-radius:2px; margin:0 4px 0 10px }
  kbd { font-size:12px; border:1px solid var(--line); border-radius:4px; padding:0 4px }
</style>
</head>
<body>
<header>
  <h1>Maskly <small style="font-weight:400;color:var(--muted)">redacts on this device · assist, not guarantee</small></h1>
  <label class="btn">Open… <input id="file" type="file" accept="image/png,image/jpeg" hidden></label>
  <button id="preview" disabled>Preview <kbd>P</kbd></button>
  <button id="save" disabled>Save PNG</button>
  <button id="copy" class="primary" disabled>Copy redacted <kbd>⌘↵</kbd></button>
</header>
<main>
  <div id="banner" role="alert">
    <b>Partial scan.</b> The AI check failed, so only pattern rules ran. Review every part by hand.
    <label><input type="checkbox" id="ack"> I checked the image myself</label>
    <div id="err" style="font-size:12px;opacity:.8"></div>
  </div>
  <div id="drop">Paste a screenshot (<kbd>⌘V</kbd>), drop it here, or click <b>Open…</b></div>
  <div id="status"></div>
  <div class="legend" id="legend" style="display:none;font-size:12px;margin-bottom:8px">
    <span style="background:var(--rules)"></span>Rule <span style="background:var(--gemma)"></span>Gemma
    <span style="background:var(--manual)"></span>Manual · click a box to turn it off/on · drag to draw a box
  </div>
  <div id="wrap"><canvas id="c"></canvas></div>
</main>
<div id="tip"></div>
<script>
const $ = id => document.getElementById(id);
const c = $('c'), ctx = c.getContext('2d'), PAD = 4;
let img = null, name = 'screenshot', boxes = [], partial = false, preview = false, drag = null;
const color = s => getComputedStyle(document.documentElement).getPropertyValue('--' + s);

async function load(blob) {
  if (!blob || !/image\/(png|jpeg)/.test(blob.type)) return alert('Please use a PNG or JPG image.');
  name = (blob.name || 'screenshot').replace(/\.\w+$/, '');
  img = await createImageBitmap(blob);
  c.width = img.width; c.height = img.height; boxes = []; preview = false;
  $('drop').style.display = 'none'; $('wrap').style.display = 'block'; $('legend').style.display = 'block';
  $('banner').style.display = 'none'; $('status').textContent = 'Scanning on this device…'; setReady(false); draw();
  const t = performance.now();
  try {
    const r = await fetch('/detect', { method: 'POST', body: blob });
    if (!r.ok) throw new Error(await r.text());
    const d = await r.json();
    boxes = d.boxes.map(b => ({ ...b, on: true }));
    partial = d.partial;
    $('err').textContent = d.error || '';
    $('status').textContent = `${boxes.length} boxes · ${d.words} words read · ${((performance.now() - t) / 1000).toFixed(1)} s ` +
      `(OCR+rules ${d.ms.ocr_rules} ms, Gemma ${d.ms.gemma} ms, ${d.backend})` +
      (d.backend === 'cloud' ? ' · ⚠ Local Gemma unavailable: used cloud Gemma. Rule matches were blacked out before sending.' : '');
  } catch (e) {
    partial = true; $('err').textContent = String(e); $('status').textContent = 'Scan failed. Draw boxes by hand.';
  }
  $('banner').style.display = partial ? 'block' : 'none'; $('ack').checked = false;
  setReady(true); draw();
}

function setReady(ok) {
  for (const id of ['preview', 'save', 'copy']) $(id).disabled = !ok || (id !== 'preview' && partial && !$('ack').checked);
}
$('ack').onchange = () => setReady(true);

// FR-12 says 4 px; OCR boxes hug the glyphs, so pad grows with text height (20%) to cover edge pixels.
function pad(b) {
  const [x0, y0, x1, y1] = b.box, p = b.source === 'manual' ? PAD : Math.max(PAD, (y1 - y0) * 0.2);
  return [x0 - p, y0 - p, x1 - x0 + 2 * p, y1 - y0 + 2 * p];
}

function draw() {
  if (!img) return;
  ctx.drawImage(img, 0, 0);
  for (const b of boxes) {
    const r = pad(b);
    if (preview) { if (b.on) { ctx.fillStyle = '#000'; ctx.fillRect(...r); } continue; }
    ctx.lineWidth = Math.max(2, img.width / 800);
    ctx.strokeStyle = color(b.source); ctx.setLineDash(b.on ? [] : [6, 4]);
    if (b.on) { ctx.fillStyle = color(b.source) + '55'; ctx.fillRect(...r); }
    ctx.strokeRect(...r);
  }
  ctx.setLineDash([]);
  if (drag && drag.moved) { ctx.strokeStyle = color('manual'); ctx.strokeRect(drag.x, drag.y, drag.x2 - drag.x, drag.y2 - drag.y); }
}

function pt(e) { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; }
function hit(x, y) {
  for (let i = boxes.length - 1; i >= 0; i--) { const [bx, by, w, h] = pad(boxes[i]); if (x >= bx && x <= bx + w && y >= by && y <= by + h) return boxes[i]; }
}

c.onmousedown = e => { const [x, y] = pt(e); drag = { x, y, x2: x, y2: y, moved: false }; };
c.onmousemove = e => {
  const [x, y] = pt(e);
  if (drag) { drag.x2 = x; drag.y2 = y; drag.moved ||= Math.hypot(x - drag.x, y - drag.y) > 6; draw(); return; }
  const b = hit(x, y), tip = $('tip');
  if (b && !preview) {
    tip.textContent = `${b.category} · ${b.source}${b.source === 'gemma' ? ' ' + b.confidence : ''} — ${b.reason}`;
    tip.style.left = e.clientX + 12 + 'px'; tip.style.top = e.clientY + 12 + 'px'; tip.style.display = 'block';
  } else tip.style.display = 'none';
};
window.onmouseup = e => {
  if (!drag) return;
  if (drag.moved) {
    const x0 = Math.min(drag.x, drag.x2), y0 = Math.min(drag.y, drag.y2), x1 = Math.max(drag.x, drag.x2), y1 = Math.max(drag.y, drag.y2);
    boxes.push({ box: [x0 + PAD, y0 + PAD, x1 - PAD, y1 - PAD], source: 'manual', category: 'manual', reason: 'Drawn by you', on: true });
  } else if (e.target === c) { const b = hit(drag.x, drag.y); if (b) b.on = !b.on; }
  drag = null; draw();
};
c.onmouseleave = () => $('tip').style.display = 'none';

function render() {  // flatten: solid fill drawn into new pixels, re-encoded PNG carries no EXIF
  const o = document.createElement('canvas'); o.width = img.width; o.height = img.height;
  const x = o.getContext('2d'); x.drawImage(img, 0, 0); x.fillStyle = '#000';
  for (const b of boxes) if (b.on) x.fillRect(...pad(b));
  return new Promise(res => o.toBlob(res, 'image/png'));
}
async function copy() {
  if ($('copy').disabled) return;
  try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': render() })]); $('status').textContent = 'Redacted image copied. Paste it into your ticket.'; }
  catch (e) { alert('Copy failed: ' + e + '. Use Save PNG.'); }
}
async function save() {
  const a = document.createElement('a'); a.href = URL.createObjectURL(await render());
  a.download = name + '_redacted.png'; a.click(); URL.revokeObjectURL(a.href);
}
$('copy').onclick = copy; $('save').onclick = save;
$('preview').onclick = () => { preview = !preview; draw(); };

$('file').onchange = e => load(e.target.files[0]);
document.onpaste = e => { const f = [...e.clipboardData.files][0]; if (f) load(f); };
document.ondragover = e => { e.preventDefault(); $('drop').classList.add('over'); };
document.ondrop = e => { e.preventDefault(); $('drop').classList.remove('over'); load(e.dataTransfer.files[0]); };
document.onkeydown = e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) copy();
  else if (e.key.toLowerCase() === 'p' && img && !e.metaKey && !e.ctrlKey) $('preview').click();
};
</script>
</body>
</html>
